<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Radiocontrole</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d2f5a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 20px;
      text-align: center;
      background: #0b2546;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .logo {
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
    }

    p {
      font-size: 15px;
      color: #dcdcdc;
      margin-bottom: 25px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn:hover {
      transform: scale(1.02);
    }

    .mercado {
      background: #ffe600;
      color: #000;
    }

    .amazon {
      background: #ff9900;
      color: #000;
    }

    .whatsapp {
      background: #25d366;
      color: #fff;
    }

    .instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
      color: #fff;
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="container">

   <img src="logo.png" alt="Radiocontrole" class="logo">

    

    <a class="btn mercado" href="https://www.mercadolivre.com.br/loja/radiocontrole#from=share_eshop" target="_blank">
      Loja no Mercado Livre
    </a>

    <a class="btn amazon" href="https://www.amazon.com.br/shops/radiocontrole" target="_blank">
      Loja na Amazon
    </a>

    <a class="btn whatsapp" href="https://wa.me/555180428809" target="_blank">
      Atendimento via WhatsApp
    </a>

    <a class="btn instagram" href="https://www.instagram.com/radiocontrole" target="_blank">
      Instagram
    </a>

    <footer>
      © 2026 Radiocontrole
    </footer>

  </div>
</body>
</html>
